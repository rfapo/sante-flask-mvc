{% extends "base.html" %}
{% block title %}Settings - Santé Admin{% endblock %}

{% block content %}
<div class="mb-8">
  <h1 class="text-3xl font-bold mb-2">Settings</h1>
  <p class="text-gray-400">Configure system settings and API keys</p>
</div>

<div class="card max-w-lg">
  <form method="POST">
    <h2 class="text-xl font-semibold mb-4">OpenAI Configuration</h2>

    <div class="mb-4">
      <label for="openai_api_key" class="block text-sm font-medium mb-2">OpenAI API Key</label>
      <input type="password" id="openai_api_key" name="openai_api_key" value="{{ openai_api_key }}"
             placeholder="sk-..."
             class="w-full px-3 py-2 bg-black border border-gray-600 rounded focus:outline-none focus:border-white">
      <p class="text-xs text-gray-500 mt-1">Required for AI report generation</p>
    </div>

    <div class="mb-6">
      <label for="openai_model" class="block text-sm font-medium mb-2">OpenAI Model</label>
      <select id="openai_model" name="openai_model"
              class="w-full px-3 py-2 bg-black border border-gray-600 rounded focus:outline-none focus:border-white">
        <option value="gpt-4o-mini" {{ 'selected' if openai_model == 'gpt-4o-mini' else '' }}>GPT-4o Mini (Fast, Cost-effective)</option>
        <option value="gpt-4o" {{ 'selected' if openai_model == 'gpt-4o' else '' }}>GPT-4o (Most capable)</option>
        <option value="gpt-4-turbo" {{ 'selected' if openai_model == 'gpt-4-turbo' else '' }}>GPT-4 Turbo</option>
        <option value="gpt-3.5-turbo" {{ 'selected' if openai_model == 'gpt-3.5-turbo' else '' }}>GPT-3.5 Turbo (Fastest)</option>
      </select>
    </div>

    <div class="flex gap-4">
      <button type="submit" class="button">Save Settings</button>
      <a href="{{ url_for('admin.dashboard') }}" class="text-gray-400 hover:text-white py-3">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
